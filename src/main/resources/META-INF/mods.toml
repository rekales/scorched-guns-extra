modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile=""
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="scguns"
mandatory=true
versionRange="[0.5.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="terrablender"
mandatory=true
versionRange="[3.0.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="betteroceanmonuments"
mandatory=false
versionRange="[1.20-Forge-3.0.4,)"
ordering="AFTER"
side="BOTH"